<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>BirdCam</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%236cc070'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%230f1115'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-fs" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-fsx" viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
</svg>
<header>
  <h1>BirdCam</h1>
  <nav id="cameras" aria-label="Cameras"></nav>
  <div id="auth"></div>
</header>
<main id="stage">
  <div id="box">
    <video id="video" playsinline muted></video>
    <div id="overlay" role="status" aria-live="polite" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <span id="overlay-text"></span>
      <button id="overlay-login" class="pill" type="button" hidden>Log in</button>
    </div>
    <div id="rec-badge" role="status" hidden><span class="rec-dot" aria-hidden="true"></span>REC <span id="rec-time">0:00</span></div>
    <div id="controls">
      <button id="mute" class="icon" type="button" aria-label="Unmute (m)" title="Unmute (m)">
        <svg class="on" aria-hidden="true"><use href="#i-vol"/></svg><svg class="off" aria-hidden="true"><use href="#i-mute"/></svg>
      </button>
      <button id="unmute-hint" class="pill" type="button" hidden>Tap to unmute</button>
      <span class="spacer"></span>
      <button id="record" class="icon" type="button" aria-label="Start recording" title="Record" hidden>
        <svg class="off" aria-hidden="true"><use href="#i-rec"/></svg><svg class="on" aria-hidden="true"><use href="#i-stop"/></svg>
      </button>
      <button id="fullscreen" class="icon" type="button" aria-label="Fullscreen (f)" title="Fullscreen (f)">
        <svg class="off" aria-hidden="true"><use href="#i-fs"/></svg><svg class="on" aria-hidden="true"><use href="#i-fsx"/></svg>
      </button>
    </div>
  </div>
</main>
<footer id="info"></footer>
<script src="app.js"></script>
</body>
</html>
