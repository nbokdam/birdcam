# birdcam-server configuration (copy to /etc/birdcam/server.yaml).

# HTTP: web page, /agent WebSocket, /api, /auth. Put a TLS reverse proxy
# (Caddy) in front of it; see Caddyfile.example.
listen: ":8080"

# Public base URL of the web page. Used as the default OIDC redirect base
# (external_url + /auth/callback) and, if https, session cookies are marked
# Secure.
external_url: https://birdcam.example.com

# Generated state: the self-signed ingest TLS certificate lives here
# (ingest-cert.pem / ingest-key.pem), so its fingerprint is stable across
# restarts. Must be writable by the server (systemd: StateDirectory=birdcam).
state_dir: /var/lib/birdcam

# Map the host name a viewer uses to the device shown by default (the page's
# ?device= parameter still overrides it). Matched on the Host header, port
# stripped, case-insensitive.
hosts:
  - host: maci.birdcam.example.com
    default_device: shed-pi

# Use X-Forwarded-Host (set by Caddy) instead of Host for the mapping above.
# Only enable this if birdcam-server is reachable exclusively through the
# proxy (listen on 127.0.0.1); otherwise clients can spoof the header.
# Caddy passes the original Host header through anyway, so this is rarely
# needed.
trust_proxy_headers: false

# TCP ingest port pool, shared by all agents/cameras. One port per streaming
# camera. Must be reachable from the Pis (open in the firewall).
ingest:
  port_min: 9001
  port_max: 9010
  # bind: ""          # optional bind address, default all interfaces
  # Host (name or IP) the agents must send their media to. Agents always
  # connect their control WebSocket to the stable name in their server_url, and
  # the server tells them in every `start` where to stream. Set this when the
  # control channel goes through a load balancer or proxy but the ingest ports
  # are reachable directly on the machine that runs the server (e.g. the node
  # a Kubernetes pod runs on). Empty = agents use the host of their server_url.
  # public_host: "203.0.113.10"
  # Encrypt media from the agents with TLS (1.3). The server sends the
  # SHA-256 of its certificate to each agent over the control WebSocket and
  # the agent pins it, so a self-signed certificate is fine. That pin is only
  # as trustworthy as the control channel: agents must use wss:// (via Caddy).
  tls: true
  # Optional own certificate; if unset, a self-signed ECDSA P-256 certificate
  # is generated in state_dir on first start.
  # cert_file: /etc/birdcam/ingest-cert.pem
  # key_file: /etc/birdcam/ingest-key.pem

# Agent self-update. The server image ships agent builds (same version as the
# server) in /usr/share/birdcam/agents; every agent that reports a different
# version is offered the matching build and restarts into it when idle.
# Disabled for development builds and when the directory has no builds. For a
# non-container install, build them with `make build-agent` and point dir at
# the bin/ directory.
# agent_updates:
#   dir: /usr/share/birdcam/agents
#   disabled: false

webrtc:
  # All WebRTC media to browsers uses this single UDP port. Open/forward it.
  udp_port: 8189
  # If the server is behind NAT (e.g. at home with UDP 8189 port-forwarded),
  # list the public IP here; it is advertised in addition to the local IPs.
  # public_ips: ["203.0.113.10"]
  # Alternatively discover the public address via STUN:
  # stun_servers: ["stun:stun.l.google.com:19302"]

# Viewer login via OpenID Connect (e.g. Authelia backed by lldap). Login is
# enabled iff auth.oidc.issuer is set. Without it, every camera that has
# groups is hidden (public cameras stay visible).
#
# Example Authelia client (configuration.yml, identity_providers.oidc.clients):
#
#   - client_id: birdcam
#     client_name: BirdCam
#     # authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72
#     client_secret: '$pbkdf2-sha512$310000$...'
#     public: false
#     authorization_policy: one_factor   # or two_factor
#     redirect_uris:
#       - https://birdcam.example.com/auth/callback
#       - https://maci.birdcam.example.com/auth/callback   # see redirect_url below
#     scopes: [openid, profile, email, groups]
#     grant_types: [authorization_code]
#     response_types: [code]
#     require_pkce: true
#     pkce_challenge_method: S256
#     token_endpoint_auth_method: client_secret_basic
#     # Only used if Authelia advertises end_session_endpoint (RP-initiated logout):
#     # post_logout_redirect_uris: [https://birdcam.example.com/]
#
# Groups come from lldap group membership. Recent Authelia versions put
# groups/profile claims only into the userinfo response; birdcam-server falls
# back to the userinfo endpoint when they are missing from the ID token.
auth:
  oidc:
    issuer: https://auth.example.com
    client_id: birdcam
    client_secret: "change-me"            # the plain secret, not the hash
    # client_secret_file: /etc/birdcam/oidc-client-secret
    # Default: external_url + /auth/callback. Login cookies are host-only, so
    # viewers on another host name (hosts: above) are sent back to this URL's
    # host after login.
    redirect_url: ""
    scopes: [openid, profile, email, groups]
    groups_claim: groups
    token_auth_method: client_secret_basic  # or client_secret_post
  # 32-byte key encrypting session cookies (AES-256-GCM), hex or base64:
  #   openssl rand -hex 32 > /etc/birdcam/session.key
  # The file may also hold the 32 raw bytes. Or inline: session_key: "<hex>".
  # If neither is set a random key is used and logins are lost on restart.
  session_key_file: /etc/birdcam/session.key
  session_ttl: 168h

# Requested from agents unless overridden per camera.
default_profile:
  width: 1280
  height: 720
  fps: 30
  audio: true

# Agents allowed to connect. Generate keys with: openssl rand -hex 24
devices:
  - id: garden-pi
    key: "change-me-0123456789abcdef0123456789abcdef"
    # or read it from a file (relative paths are relative to this config file):
    # key_file: /etc/birdcam/keys/garden-pi
    name: Garden
    # Upload budget, split evenly over the device's cameras that are streaming
    # (a single streaming camera gets all of it). 0 = unlimited.
    max_kbps: 3000
    # No groups: the device's cameras are public.
  - id: shed-pi
    key: "change-me-fedcba9876543210fedcba9876543210"
    name: Maci
    # Only logged-in members of one of these groups see this device's
    # cameras (unless a camera overrides it). Empty/absent = public.
    groups: [family]

# Optional per-camera overrides. camera_id is the id the agent reports
# (derived from /dev/v4l/by-id); see GET /api/cameras.
cameras:
  - device_id: garden-pi
    camera_id: usb-046d_HD_Pro_Webcam_C920-video-index0
    name: Feeder                # default: the name the agent reports
    max_kbps: 2000              # caps this camera's share of the device budget
    width: 1920
    height: 1080
    fps: 30
    rotation: 0                 # 0/90/180/270 clockwise; overrides the agent's value
  - device_id: shed-pi
    camera_id: usb-Some_Cam-video-index0
    name: Nest box
    audio: false
    rotation: 90
    night_grayscale: auto       # off (default) | auto | on; browser shows IR-tinted night video in grayscale
    # groups: [family, friends]   # overrides the device's groups
    # public: true                # visible to everyone, ignoring groups
    # hidden: true                # hide from the page and refuse viewers
