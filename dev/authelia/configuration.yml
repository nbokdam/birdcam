# Authelia config for the local test environment (see dev/README.md).
# Secrets are not in this file: they are generated by up.sh into dev/.secrets/
# (mounted at /secrets) and read via *_FILE environment variables
# (compose.yaml) or the template filter's secret function (see the jwks key
# and client_secret below). Note: template syntax is evaluated even in comments.
server:
  address: 'tcp://:9091'
log:
  level: info
theme: dark
ntp:
  disable_startup_check: true

authentication_backend:
  file:
    path: /config/users.yml

access_control:
  default_policy: one_factor

session:
  cookies:
    - domain: 'birdcam.localhost'
      authelia_url: 'https://auth.birdcam.localhost:8443'

storage:
  local:
    path: /data/db.sqlite3

notifier:
  filesystem:
    filename: /data/notification.txt

identity_providers:
  oidc:
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/secrets/oidc.key" | mindent 10 "|" | msquote }}
    clients:
      - client_id: birdcam
        client_name: BirdCam (dev)
        client_secret: {{ secret "/secrets/client-secret.hash" | msquote }}
        public: false
        authorization_policy: one_factor
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://birdcam.localhost:8443/auth/callback
        scopes: [openid, profile, email, groups]
        response_types: [code]
        grant_types: [authorization_code]
        token_endpoint_auth_method: client_secret_basic
