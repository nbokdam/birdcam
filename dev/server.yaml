# birdcam-server config for the local test environment (see dev/README.md).
# Relative paths are resolved against this file's directory; the secrets in
# .secrets/ are generated by up.sh.
#
#   SSL_CERT_FILE=dev/.secrets/caddy-root.crt bin/birdcam-server -config dev/server.yaml
listen: ":8080"
external_url: https://birdcam.localhost:8443
state_dir: .secrets/state

auth:
  oidc:
    issuer: https://auth.birdcam.localhost:8443
    client_id: birdcam
    client_secret_file: .secrets/client-secret
  session_key_file: .secrets/birdcam-session.key

hosts:
  - host: birdcam.localhost
    default_device: test-pi

ingest:
  port_min: 9001
  port_max: 9010
  tls: true

webrtc:
  udp_port: 8189

default_profile: {width: 1280, height: 720, fps: 30, audio: true}

devices:
  - id: test-pi
    key_file: .secrets/device-key
    name: Test Pi
    # max_kbps: 2000

# The test rig's cameras (ids from `birdcam-agent -list-cameras`).
cameras:
  - device_id: test-pi
    camera_id: usb-usb-camera-manufacture-h264-usb-camera-2020052801
    name: H.264 camera (family only)
    groups: [family]
  - device_id: test-pi
    camera_id: usb-generic-general-uvc
    name: C1 lookalike
    night_grayscale: auto
  - device_id: test-pi
    camera_id: usb-microsoft-microsoft-lifecam-studio-tm
    name: LifeCam
